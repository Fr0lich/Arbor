name: Arbor CI & Portable Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Core Regression & Smoke Tests (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Generate offline demo dataset
        run: python scripts/create_demo_dataset.py

      - name: Run core verification test suite
        run: |
          python -m pytest `
            tests/test_hardened_data_safety.py `
            tests/test_demo_dataset.py `
            tests/test_navigation_and_dialogs.py `
            tests/test_sandbox_tutorials.py `
            tests/test_mobile_companion.py `
            tests/test_mobile_companion_offline.py `
            tests/test_command_palette_and_search.py `
            tests/test_problem_persistence_fix.py `
            tests/test_status_bar.py `
            -q

  build-exe:
    name: Build Standalone Windows Arbor.exe
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Build dist/Arbor.exe via build_exe.bat
        shell: cmd
        run: build_exe.bat --no-pause

      - name: Verify portable dist bundle contents
        shell: pwsh
        run: |
          $required = @(
            "dist\Arbor.exe",
            "dist\USER_GUIDE.md",
            "dist\MOBILE_COMPANION_USER_GUIDE.md",
            "dist\ignored_words.json",
            "dist\data\demo_collection.xlsx"
          )
          foreach ($item in $required) {
            if (-not (Test-Path $item)) {
              Write-Error "Missing required release artifact: $item"
              exit 1
            }
          }
          Get-ChildItem dist -Recurse | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Upload Arbor Windows Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arbor-Windows-Portable
          path: dist/
          retention-days: 30
